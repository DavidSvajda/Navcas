services:
  app:
    build:
      context: ..
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      TRUST_PROXY: 172.30.0.2
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 2
    networks:
      edge:
        ipv4_address: 172.30.0.3
  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      edge:
        ipv4_address: 172.30.0.2
networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
volumes:
  caddy_data:
  caddy_config:
