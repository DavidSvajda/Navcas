name: Validate application
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: navcas_test
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: ci-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_owner -d navcas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run security:scan
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: node node_modules/vitest/vitest.mjs run tests/postgres.test.ts
        env:
          PG_TEST_HOST: 127.0.0.1
          PG_TEST_PASSWORD: ci-local-only
      - run: npm run build
      - run: node scripts/check-worker.mjs
      - run: docker build -t navcas:ci .
      - run: docker build -f deploy/backup.Dockerfile -t navcas-backup:ci .
      - run: node scripts/check-backup.mjs
        env:
          PG_TEST_HOST: 127.0.0.1
          PG_TEST_PASSWORD: ci-local-only
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 3
  arm:
    name: Native ARM64 Docker and worker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t navcas:arm .
      - run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges navcas:arm node -e "if(process.arch!=='arm64')process.exit(1);require('sodium-native');console.log('ARM64 crypto OK')"
      - run: docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -v "$PWD/scripts/check-worker.mjs:/app/scripts/check-worker.mjs:ro" navcas:arm node scripts/check-worker.mjs
      - run: docker build -f deploy/backup.Dockerfile -t navcas-backup:arm .
      - run: docker run --rm --entrypoint pg_dump navcas-backup:arm --version
